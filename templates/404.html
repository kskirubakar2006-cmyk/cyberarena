{% extends 'base.html' %}

{% block title %}CyberArena - 404 Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 text-center">
        <i class="fas fa-satellite-dish fa-5x text-muted mb-4"></i>
        <h1 class="display-1 fw-bold text-danger mb-0">404</h1>
        <h3 class="mb-4 text-white">Signal Lost</h3>
        <p class="text-muted-custom lead mb-5">The requested sector could not be found in the CyberArena. It may have been relocated or deleted.</p>
        <a href="{{ url_for('index') }}" class="btn btn-cyber px-4"><i class="fas fa-home me-2"></i>Return to Base</a>
    </div>
</div>
{% endblock %}
