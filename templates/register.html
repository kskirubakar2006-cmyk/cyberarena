{% extends 'base.html' %}

{% block title %}CyberArena - Register{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x text-cyan mb-3"></i>
                <h2 class="fw-bold">Create Account</h2>
                <p class="text-muted-custom">Join the CyberArena and start training</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label for="name" class="form-label text-muted-custom small text-uppercase fw-bold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-cyan"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-muted-custom small text-uppercase fw-bold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-cyan"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label text-muted-custom small text-uppercase fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-cyan"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required minlength="6">
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="confirm_password" class="form-label text-muted-custom small text-uppercase fw-bold">Confirm</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-cyan"><i class="fas fa-check"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-cyber w-100 mb-3">Register <i class="fas fa-arrow-right ms-2"></i></button>
                
                <div class="text-center mt-3">
                    <p class="text-muted-custom mb-0">Already a recruit? <a href="{{ url_for('auth.login') }}" class="fw-bold">Login here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
