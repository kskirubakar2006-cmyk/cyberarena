{% extends 'base.html' %}

{% block title %}CyberArena - Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="fas fa-shield-halved fa-3x text-cyan mb-3"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted-custom">Log in to continue your training</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted-custom small text-uppercase fw-bold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-cyan"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label text-muted-custom small text-uppercase fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-cyan"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-cyber w-100 mb-3">Authenticate <i class="fas fa-arrow-right ms-2"></i></button>
                
                <div class="text-center mt-3">
                    <p class="text-muted-custom mb-0">New recruit? <a href="{{ url_for('auth.register') }}" class="fw-bold">Register here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
